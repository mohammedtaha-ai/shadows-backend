# HTTP owns canonical wire schemas, never domain authority.
name: http-wire
status: current
source: src/transports/http
owns: Canonical auth-v1 and nylra-v1 TypeBox schemas, strict request/output validation, bearer translation and safe refusals.
public_api:
  nylraOperations: The code-owned HTTP/WebSocket operation registry with stable IDs and implementation status; exported to api/nylra-v1.openapi.json. Implemented rows bind live; planned rows are mock-only.
  registerNylra: Binds only implemented canonical operations in an isolated refusal scope.
  assertNylraBindings: Detects method, path and schema drift in actual HTTP registrations.
  serveEvents: Replays durable pages through SSE with fresh delivery guards and bounded buffering.
  NylraRefusal: The one refusal shape every nylra-v1 operation returns.
  registerAuth: Registers login/return/session/device and provider/logout callback routes.
  authenticate: Translates a bearer through persisted identity authorization.
  authenticateRevocation: Uses local account/session/device verification only for operations that surrender authority.
  output: Explicitly checks outgoing values before Fastify serialization.
obligations:
  - rule: Account text chat and connection operations are implemented; credentials are write-only, bodies reject extra fields, and paid probes, context transfer and deletion require explicit true acknowledgements.
    tested_by: nylra_wire account chat operations are implemented and keep credentials write only
    note: tests/integration/nylra-wire.test.ts; also nylra_wire chat acknowledgements metadata and safe refusal categories are required.
  - rule: Mock serves only planned operations and never shadows implemented routes; planned responses are schema-checked.
    tested_by: nylra_mock answers every planned operation and never shadows implemented routes
    note: tests/integration/nylra-mock.test.ts
  - rule: Live metadata remains credential-free, wrong-account resources return 404, and paid probes require an explicit acknowledgement before one host provider invocation.
    tested_by: chat_routes_paid_probe_requires_explicit_acknowledgement_and_returns_only_safe_outcomes
    note: tests/integration/chat-routes.test.ts; chat_routes_bind_implemented_operations_isolate_accounts_and_never_return_credentials covers metadata and wrong-account operations.
  - rule: Topic SSE replays committed owner events with fresh principal/topic checks, rejects missing or expired cursors, and uses the shared 100-event page, 15-second watchdog and 1 MiB buffering limits.
    tested_by: chat_routes_topic_sse_replays_committed_events_with_scoped_cursor_refusals
    note: tests/integration/chat-routes.test.ts; shared stalled-send behavior remains covered by review_sse_stalled_send_cancels_on_revoke.
  - rule: Deletion or origin revocation between a topic journal read and SSE delivery closes the stream before the captured payload is sent.
    tested_by: chat_routes_topic_stream_rechecks_deletion_and_revocation_after_journal_read
    note: tests/integration/chat-routes.test.ts
  - rule: Stalled SSE writes do not block independent authority checks or disconnect cancellation.
    tested_by: review_sse_stalled_send_cancels_on_revoke
    note: tests/integration/relay-review-regressions.test.ts; disconnect also releases a pending send without drain.
  - rule: Actual HTTP bindings match code operations and reject deliberate binding drift; auth export is unchanged.
    tested_by: nylra_live_routes_registry_coverage_strict_cursor_errors_and_auth_isolation
    note: tests/integration/nylra-live-routes.test.ts
  - rule: Revocation between a persisted account read and delivery closes without exposing its payload.
    tested_by: account_stream_revocation_between_persisted_read_and_delivery_closes_without_payload
    note: tests/integration/account-stream.test.ts
  - rule: Repeatable read snapshots are followed by fresh source authorization.
    tested_by: session_snapshot_fresh_authority_after_read_only_snapshot_barrier
    note: tests/integration/session-stream.test.ts
  - rule: Exported OpenAPI nullable objects accept null without losing their non-null object constraints.
    tested_by: nylra_wire exported nullable shapes accept null while retaining object constraints
    note: tests/integration/nylra-wire.test.ts; compiled with Fastify's real schema validator.
  - rule: The nylra-v1 OpenAPI 3.0 and generated TS snapshots equal what the canonical schema exports, with no const and no null type.
    tested_by: nylra_wire snapshots match the canonical schema
    note: tests/integration/nylra-wire.test.ts
  - rule: Every nylra-v1 operation declares bearer security and the shared refusal shape.
    tested_by: nylra_wire every operation is bearer-protected and refuses with the shared shape
    note: tests/integration/nylra-wire.test.ts
  - rule: Every nylra-v1 operation with a JSON answer has a fixture its schema accepts.
    tested_by: nylra_wire every operation has a schema-valid synthetic response fixture
    note: tests/integration/nylra-wire.test.ts
  - rule: Synthetic nylra-v1 fixtures pass and streams are gapless; invalid bounds, account fields, step content and multiline step summaries refuse.
    tested_by: nylra_wire fixtures pass and invalid samples refuse for their stated reason
    note: tests/integration/nylra-wire.test.ts
  - rule: Session verification maps provider outage to 503; recovered provider can validate the same session.
    tested_by: provider_outage_is_retryable_503_without_revoking_session
    note: tests/integration/provider-status.test.ts; invalid or revoked authorization still maps to 401.
  - rule: Auth 1.1 fixtures validate against canonical schemas and every protected operation declares bearer security.
    tested_by: auth_schema_bearer_annotations_and_fixture_validation
    note: tests/integration/auth-wire.test.ts
  - rule: Extra fields and bounds fail; generated protocol consumers use a live listener; invalid output refuses.
    tested_by: auth_wire rejects_extra_fields_bounds validates_output native_consumer
    note: tests/integration/auth-wire.test.ts
  - rule: Login rate limits are enforced and callback errors do not echo sensitive fixture input; logger is silent.
    tested_by: auth_wire rate_limits_without_sensitive_diagnostics
    note: tests/integration/auth-wire.test.ts
  - rule: Standard OIDC form posts reach logout verification; duplicate fields refuse.
    tested_by: backchannel_standard_form_transport_and_duplicate_field_refusal
    note: tests/integration/auth-wire.test.ts; signed-token form/replay assertions also run in tests/integration/oidc-client.test.ts.
open_questions:
  - Approvals, grants and push remain planned. Text chat has no project context; project-bound create refuses explicitly until project integration exists.
  - Native Windows browser/loopback/secure-store and later Flutter conformance remain client integration work.
  - Temporary in-process rate buckets do not establish distributed production abuse controls.
