# Composition owns wiring, configuration refusal and process lifecycle.
name: backend-application
status: current
source: src/app
owns: Synthetic-only runtime configuration, loopback listeners, one application composition and shutdown.
public_api:
  readConfig: Rejects absent/invalid config without values; requires B1_DATA_MODE synthetic and a dedicated active BYOK key with optional retained previous IDs.
  compose: Wires public identity, devices, Activity, Links, Sessions, Provider settings, Conversations, Assistant and authenticated relay. Supplies exact brain instructions and a brain/provider-adapter ReplyPort, starts dispatch for the full route set, and drains dispatch before sockets and database shutdown; auth-only schema composition starts no worker.
  createExpiry: Runs owner expiry at startup and every minute without overlap; drains work at shutdown.
  installShutdown: Registers one-shot termination handlers.
obligations:
  - rule: The provider-settings paid probe uses the host ReplyPort with a fixed synthetic message, no history, one output token and a 120-second signal; only acknowledged owner operations can invoke it.
    tested_by: chat_routes_paid_probe_requires_explicit_acknowledgement_and_returns_only_safe_outcomes
    note: tests/integration/chat-routes.test.ts uses the injected synthetic host stream; no real provider is called.
  - rule: Application startup processes pending turns through the supplied ReplyPort; repeated shutdown aborts and drains active generation before closing its pool, preserving an interrupted terminal result.
    tested_by: turn_dispatch_application_starts_worker_and_drains_abort_before_database_shutdown
    note: tests/integration/turn-dispatch.test.ts uses synthetic identity, an injected resolver and fake text stream.
  - rule: BYOK keys require canonical 32-byte base64 and valid unique IDs; active and previous IDs cannot collide.
    tested_by: byok_config_refuses_invalid_keys_ids_and_ambiguous_key_rings
    note: tests/integration/startup.test.ts
  - rule: Active and retained previous BYOK material is distinct from identity configuration; the local adapter loads its dedicated file and bootstrap preserves existing keys.
    tested_by: byok_config_loads_active_and_retained_previous_keys_separately_from_identity
    note: tests/integration/startup.test.ts; byok_local_bootstrap_and_runtime_use_isolated_synthetic_files_and_preserve_existing_keys exercises only disposable synthetic files.
  - rule: Inactive account payloads and expired receipt history can be erased without reads while counters survive.
    tested_by: review_expiry_purges_inactive_payloads_without_account_reads
    note: tests/integration/relay-review-regressions.test.ts
  - rule: Scheduled expiry never overlaps itself and shutdown waits for active work.
    tested_by: review_expiry_scheduler_is_nonoverlapping_and_drains_before_stop
    note: tests/integration/relay-review-regressions.test.ts
  - rule: Readiness fails safely when the database connection is unavailable.
    tested_by: health_refuses_after_database_disconnect
    note: tests/integration/startup.test.ts
  - rule: Invalid config is refused without echoing secret input.
    tested_by: missing_config_refuses_start
    note: tests/integration/startup.test.ts; non_https_issuer_refused also feeds sensitive-looking values and asserts the same fixed config_invalid message.
  - rule: Real identity data remains disabled pending retention review.
    tested_by: real_identity_data_disabled_until_retention_review
    note: tests/integration/startup.test.ts
  - rule: Shutdown closes pool and listener, including before Kysely initialization.
    tested_by: stop_unstarted_application_closes_uninitialized_pool
    note: tests/integration/startup.test.ts; graceful_shutdown_closes_pool separately covers startup, expiry queries and listener shutdown on migrated storage.
open_questions:
  - Production reverse proxy, TLS and signal draining under sustained traffic need deployment acceptance.
