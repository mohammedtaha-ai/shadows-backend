name: conversations
status: current
source: src/modules/conversations
owns: Account-scoped topics, pinned connection metadata, messages, accepted turns and dispatch intents, command receipts and transactional per-topic event sequences.
public_api:
  createConversations: Creates authorized topic create/list/snapshot, turn acceptance, acknowledged connection change, cursor replay and confirmed deletion operations. A turn stores its origin principal for dispatch authorization.
  ConversationsService: Public service type; application callers do not access the store or tables.
obligations:
  - rule: New turn admission refuses removed or superseded connection pins; acknowledged reselection between turns refreshes the pin. Replay of an already accepted identical command still returns its original result.
    tested_by: conversations_admission_refuses_removed_or_superseded_connection_until_acknowledged_reselection
    note: tests/integration/conversations.test.ts
  - rule: Journal failure rolls back message, turn, intent and receipt together; Activity failure rolls back deletion and cancellation. Topic metadata selection observes updated connection revision without opening its encrypted credential.
    tested_by: conversations_rollback_keeps_admission_and_deletion_atomic_and_selects_metadata_without_decryption
    note: tests/integration/conversations.test.ts
  - rule: Topic creation pins the supplied or current default connection through ProviderSettings selectForTopic in the authorized transaction; later default changes do not alter old topics. Transfer requires acknowledgement and no active turn. Commands recover identical results and conflict on changed content.
    tested_by: conversations_scope_default_pinning_transfer_and_command_replay
    note: tests/integration/conversations.test.ts
  - rule: Serialized account admission permits one active turn per topic and two per account; message, pinned turn, receipt, intent and entry event commit together, including concurrent identical-command replay.
    tested_by: conversations_serializes_busy_limits_and_atomic_receipts
    note: tests/integration/conversations.test.ts
  - rule: Complete topic history plus exact publicly exported brain instructions and new message must fit 100 serialized messages and 65536 UTF-8 bytes. Refusal stores no turn or dispatch intent and does not truncate history.
    tested_by: conversations_refuses_complete_context_overflow_without_partial_writes
    note: tests/integration/conversations.test.ts
  - rule: Snapshot and replay expose committed sequence positions, reject cursors below floor or above high water, and page at most 100 events. Confirmed deletion purges all owned rows and publishes only the opaque topic ID through Activity in the same transaction. Deleted topics refuse subsequent reads and admission.
    tested_by: conversations_journal_floor_delete_purges_owned_rows_and_publishes_activity
    note: tests/integration/conversations.test.ts
  - rule: Topic deletion account events replay without requiring a laptop link or leaking internal Activity routing fields.
    tested_by: topic_deleted_replays_over_account_sse_without_laptop_authority
    note: tests/integration/conversations.test.ts
  - rule: Only the conversations store may query its six tables, and models remain independent of database and provider SDKs.
    tested_by: conversations_store_exclusively_owns_its_tables_and_keeps_models_pure
    note: tests/architecture/boundaries.test.ts
gaps:
  - at: createConversations
    note: Dispatch worker, persisted stop, fenced generation writes and lease recovery are B-8; topic HTTP bindings and topic SSE are B-9. No provider is called by this owner yet. Deletion removes the intent/topic so a later worker must abort and reject missing-owner writes.
open_questions:
  - Real-data retention, restore and provider/device acceptance remain separate gates; current test content is synthetic.
