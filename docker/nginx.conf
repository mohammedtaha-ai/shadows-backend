map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 8088;
  server_name _;
  access_log off;
  location = /ready { return 200 'ready'; }
}
server {
  listen 8443 ssl;
  server_name 127.0.0.1;
  ssl_certificate /tls/server.pem;
  ssl_certificate_key /tls/server-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 8k;
  error_page 413 =413 @request_too_large;
  location @request_too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    return 413 '{"code":"request_invalid"}';
  }
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 8443;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_redirect off;
  location /v1/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }
  location = /health { proxy_pass http://127.0.0.1:3000; }
  location / { proxy_pass http://127.0.0.1:8080; }
}
