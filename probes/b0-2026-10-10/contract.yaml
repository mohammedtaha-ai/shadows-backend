name: b0-capability-probes
version: 1
status: current
source: probes/b0-2026-10-10
purpose: Non-product behavioral experiments retained for reviewer inspection.
external_types:
  - Fastify route schema and TypeBox JSON schema
  - Kysely Transaction and CompiledQuery
  - pg-boss Db transaction adapter
  - AI SDK streamText fullStream
  - openid-client Configuration and oidc-provider Provider
writes:
  run: Executes independent probe processes and writes artifacts/run-results.json.
  applyOrReplayRemote: Replays the synthetic owner result by identity and refuses a different fingerprint.
obligations:
  - rule: Domain write and enqueue use the same Kysely transaction connection.
    tested_by: atomic domain write and enqueue rollback and commit
    note: database.mjs asserts zero domain/job rows after rollback and one job after commit.
  - rule: Interruption after the synthetic remote commit must not produce another effect on retry.
    tested_by: interrupted lease restart recovery external reconciliation
    note: database.mjs starts worker-crash.mjs, observes exit 73, restarts pg-boss, reconciles and asserts one effect.
  - rule: Stream cancellation must propagate to the synthetic provider connection.
    tested_by: synthetic explicit cancellation propagates to provider socket
    note: ai.mjs asserts an abort part, retained chunk and closed provider socket.
  - rule: Exported fixture schema must have a working TS consumer and compiled Dart consumer.
    tested_by: schema validation generated TypeScript and compiled Dart HTTP consumers
    note: http.mjs validates OpenAPI, compiles TS, compiles Dart to an executable and runs both over loopback HTTP.
  - rule: Real-provider behavior and native Windows browser login require separate acceptance.
    tested_by: none
    note: availability.mjs records original prerequisites; ai-minimax.mjs separately exercised four real-endpoint cases, not native login or multi-round reasoning.
  - rule: The optional real MiniMax probe sends only to the official origin and saves no raw SDK error or secret value.
    tested_by: none
    note: ai-minimax.mjs safeFetch checks the origin and refuses redirects; result records use explicit fields. Both opt-in probes call ensureApiKey, prefer inherited API_KEY and optionally load local configuration. No automated negative host test exists.
not_the_caller's:
  - Deploy these fixtures or use the automatic synthetic consent as product authentication.
  - Substitute an existing database URL or infer real Shadows authority from the synthetic remote table.
gaps:
  - at: probeDir
    gap: Database cleanup guard and Dart compiler path are pinned to this Windows checkout; portability is not tested.
  - at: schema
    gap: dart-generate.mjs supports only the flat fixture DTO, not a complete J1 Dart generator.
open_questions:
  - Does MiniMax reasoning_split=true preserve separately returned reasoning metadata? minimax-rounds.mjs only verifies think-tag content with reasoning_split=false.
  - Which deployed issuer and Windows native callback mechanism will close account/device revocation and restart acceptance?
  - Will the proposed confidential-backend/native-return flow pass Windows acceptance? The public-client Keycloak HTTP fixture passed in cloud, with H2 restart only.
tests:
  - name: migration empty upgrade rollback and reapply
    checks: SQL migrations from empty and previous state, competing advisory-lock refusal, down/up and repeat-up behavior.
  - name: scoped queries rollback concurrent revision conflict
    checks: Foreign account sees zero rows, thrown transaction leaves revision zero, competing writes return zero and one rows.
  - name: response serializer limit and explicit outgoing validation
    checks: Fastify serialization alone returns negative revision; TypeBox outgoing check refuses it.
  - name: synthetic partial transport failure preserves text and explicit error
    checks: A retained text delta precedes an exception or stream error; no complete result is assumed.
  - name: synthetic OIDC PKCE state nonce code replay and refresh revocation
    checks: Public native client code exchange, state refusal, expired access refusal with zero tolerance, refresh revocation, code replay refusal and silent login refusal after logout.
  - name: wrong-state / wrong-pkce / wrong-nonce / reused-code
    checks: identity-bindings.mjs uses fresh synthetic authorization flows and asserts typed refusal; the PKCE response is invalid_grant.
  - name: backend-owned device revocation and fresh-process session validation prototype
    checks: identity-devices.mjs checks disposable PG records from new verifier processes; account-scoped device revoke, other device survival and expiry. This is not product implementation.
  - name: real non-reasoning tool result round trip / real reasoning tool continuity
    checks: minimax-rounds.mjs executes one schema-valid local tool, sends its result in a second provider request and checks a runtime-random value absent from the prompt; reasoning assistant content is preserved with parsed-tool-input equivalence.
  - name: runtime API_KEY skips local loading, including a synthetic proxy placeholder
    checks: runtime-api-key.test.mjs asserts an inherited synthetic value prevents any local loader invocation; no provider or real secret is used.
  - name: optional local loading preserves legacy configuration / missing or failed local configuration produces only a sanitized refusal
    checks: runtime-api-key.test.mjs injects a synthetic loader and verifies the fixed refusal message on missing configuration without exposing loader errors.
  - name: actual Keycloak valid code and one-time loopback return / actual Keycloak persistent session across server restart / actual Keycloak logout prevents silent reauthentication
    checks: identity-keycloak.mjs checks code exchange, one-use Node callback, refresh after isolated H2 server restart and login_required after RP logout. None proves Windows native acceptance.
  - name: actual Keycloak wrong-state refusal / actual Keycloak wrong-pkce refusal / actual Keycloak wrong-nonce refusal / actual Keycloak reused-code refusal / actual Keycloak access expiry / actual Keycloak token revocation
    checks: identity-keycloak.mjs refusal checks exact openid-client error codes; invalid_grant is required for verifier/code/refresh refusals, and expired userinfo requires a WWW-Authenticate protocol challenge. Cloud refusals-only results preserve tightened assertions separately.
